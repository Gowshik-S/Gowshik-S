</linearGradient>
<clipPath id="card"><rect width="430" height="170" rx="14"/></clipPath>
</defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}</style>
<rect x="0.5" y="0.5" width="429" height="169" rx="14" fill="#0d1117" stroke="#30363d"/>
<rect width="430" height="3" fill="url(#sweep)" clip-path="url(#card)"/>
<text x="24" y="46" fill="#e6edf3" font-size="21" font-weight="700">Rio · Live Agent</text><text x="24" y="72" fill="#8b949e" font-size="13.5">Speak once — Rio sees your screen,</text><text x="24" y="92" fill="#8b949e" font-size="13.5">plans and acts end to end.</text><text x="24" y="124" fill="#d2a8ff" font-size="12" font-weight="600">Gemini Live · Google ADK · Cloud Run</text><rect x="330" width="6" rx="3" fill="#d2a8ff" y="81.0" height="8"><animate attributeName="height" values="8;30;8" dur="0.9s" repeatCount="indefinite"/><animate attributeName="y" values="81.0;70.0;81.0" dur="0.9s" repeatCount="indefinite"/></rect><rect x="341" width="6" rx="3" fill="#d2a8ff" y="79.0" height="12"><animate attributeName="height" values="12;46;12" dur="0.7s" repeatCount="indefinite"/><animate attributeName="y" values="79.0;62.0;79.0" dur="0.7s" repeatCount="indefinite"/></rect><rect x="352" width="6" rx="3" fill="#d2a8ff" y="82.0" height="6"><animate attributeName="height" values="6;38;6" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="82.0;66.0;82.0" dur="1.1s" repeatCount="indefinite"/></rect><rect x="363" width="6" rx="3" fill="#d2a8ff" y="78.0" height="14"><animate attributeName="height" values="14;54;14" dur="0.8s" repeatCount="indefinite"/><animate attributeName="y" values="78.0;58.0;78.0" dur="0.8s" repeatCount="indefinite"/></rect><rect x="374" width="6" rx="3" fill="#d2a8ff" y="82.0" height="6"><animate attributeName="height" values="6;40;6" dur="1.0s" repeatCount="indefinite"/><animate attributeName="y" values="82.0;65.0;82.0" dur="1.0s" repeatCount="indefinite"/></rect><rect x="385" width="6" rx="3" fill="#d2a8ff" y="80.0" height="10"><animate attributeName="height" values="10;48;10" dur="0.75s" repeatCount="indefinite"/><animate attributeName="y" values="80.0;61.0;80.0" dur="0.75s" repeatCount="indefinite"/></rect><rect x="396" width="6" rx="3" fill="#d2a8ff" y="81.0" height="8"><animate attributeName="height" values="8;28;8" dur="0.95s" repeatCount="indefinite"/><animate attributeName="y" values="81.0;71.0;81.0" dur="0.95s" repeatCount="indefinite"/></rect>
