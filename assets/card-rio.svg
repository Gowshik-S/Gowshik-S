<svg xmlns="http://www.w3.org/2000/svg" width="430" height="170" viewBox="0 0 430 170" role="img" aria-label="Rio Live Agent">
<title>Rio Live Agent</title>
<defs>
<linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="-430" y1="0" x2="0" y2="0">
<stop offset="0" stop-color="#d2a8ff" stop-opacity="0"/><stop offset="0.5" stop-color="#d2a8ff"/><stop offset="1" stop-color="#d2a8ff" stop-opacity="0"/>
