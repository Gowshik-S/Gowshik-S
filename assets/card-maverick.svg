<svg xmlns="http://www.w3.org/2000/svg" width="430" height="170" viewBox="0 0 430 170" role="img" aria-label="Maverick coding platform">
<title>Maverick coding platform</title>
<defs>
<linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="-430" y1="0" x2="0" y2="0">
<stop offset="0" stop-color="#58a6ff" stop-opacity="0"/><stop offset="0.5" stop-color="#58a6ff"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
<animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="860 0" dur="4s" repeatCount="indefinite"/>
</linearGradient>
<clipPath id="card"><rect width="430" height="170" rx="14"/></clipPath>
</defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}</style>
<rect x="0.5" y="0.5" width="429" height="169" rx="14" fill="#0d1117" stroke="#30363d"/>
<rect width="430" height="3" fill="url(#sweep)" clip-path="url(#card)"/>
<text x="24" y="46" fill="#e6edf3" font-size="21" font-weight="700">Maverick</text><text x="24" y="72" fill="#8b949e" font-size="13.5">AI agents read your resume, set coding</text><text x="24" y="92" fill="#8b949e" font-size="13.5">challenges and plan what to learn next.</text><text x="24" y="124" fill="#58a6ff" font-size="12" font-weight="600">FastAPI · React · Qwen via Groq</text><line x1="342" y1="85" x2="398" y2="85" stroke="#58a6ff" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 4"><animate attributeName="stroke-dashoffset" values="8;0" dur="0.6s" repeatCount="indefinite"/></line><circle cx="330" cy="85" r="14" fill="#0d1117"/><g><circle cx="330" cy="85" r="13" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/><text x="330" y="89.5" fill="#58a6ff" font-size="12" font-weight="700" text-anchor="middle">P</text><animate attributeName="opacity" values="1;0.3;0.3" calcMode="discrete" dur="2.4s" repeatCount="indefinite"/></g><circle cx="370" cy="85" r="14" fill="#0d1117"/><g><circle cx="370" cy="85" r="13" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/><text x="370" y="89.5" fill="#58a6ff" font-size="12" font-weight="700" text-anchor="middle">A</text><animate attributeName="opacity" values="0.3;1;0.3" calcMode="discrete" dur="2.4s" repeatCount="indefinite"/></g><circle cx="410" cy="85" r="14" fill="#0d1117"/><g><circle cx="410" cy="85" r="13" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/><text x="410" y="89.5" fill="#58a6ff" font-size="12" font-weight="700" text-anchor="middle">R</text><animate attributeName="opacity" values="0.3;0.3;1" calcMode="discrete" dur="2.4s" repeatCount="indefinite"/></g>
</svg>
