<svg xmlns="http://www.w3.org/2000/svg" width="430" height="170" viewBox="0 0 430 170" role="img" aria-label="Xyena AI">
<title>Xyena AI</title>
<defs>
<linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="-430" y1="0" x2="0" y2="0">
<stop offset="0" stop-color="#3fb950" stop-opacity="0"/><stop offset="0.5" stop-color="#3fb950"/><stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
<animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="860 0" dur="4s" repeatCount="indefinite"/>
</linearGradient>
<clipPath id="card"><rect width="430" height="170" rx="14"/></clipPath>
