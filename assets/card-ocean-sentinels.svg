<svg xmlns="http://www.w3.org/2000/svg" width="430" height="170" viewBox="0 0 430 170" role="img" aria-label="Ocean Sentinels">
<title>Ocean Sentinels</title>
<defs>
<linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="-430" y1="0" x2="0" y2="0">
<stop offset="0" stop-color="#56d4dd" stop-opacity="0"/><stop offset="0.5" stop-color="#56d4dd"/><stop offset="1" stop-color="#56d4dd" stop-opacity="0"/>
<animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="860 0" dur="4s" repeatCount="indefinite"/>
</linearGradient>
<clipPath id="card"><rect width="430" height="170" rx="14"/></clipPath>
</defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}</style>
<rect x="0.5" y="0.5" width="429" height="169" rx="14" fill="#0d1117" stroke="#30363d"/>
<rect width="430" height="3" fill="url(#sweep)" clip-path="url(#card)"/>
<text x="24" y="46" fill="#e6edf3" font-size="21" font-weight="700">Ocean Sentinels</text><text x="24" y="72" fill="#8b949e" font-size="13.5">Offline-first disaster reporting —</text><text x="24" y="92" fill="#8b949e" font-size="13.5">phones relay alerts over Bluetooth mesh.</text><text x="24" y="124" fill="#56d4dd" font-size="12" font-weight="600">Kotlin · BLE mesh · FastAPI · SIH 2025</text><line x1="330" y1="60" x2="390" y2="48" stroke="#56d4dd" stroke-opacity="0.3" stroke-width="1.5"/><line x1="330" y1="60" x2="372" y2="112" stroke="#56d4dd" stroke-opacity="0.3" stroke-width="1.5"/><line x1="390" y1="48" x2="410" y2="96" stroke="#56d4dd" stroke-opacity="0.3" stroke-width="1.5"/><line x1="372" y1="112" x2="410" y2="96" stroke="#56d4dd" stroke-opacity="0.3" stroke-width="1.5"/><line x1="390" y1="48" x2="372" y2="112" stroke="#56d4dd" stroke-opacity="0.3" stroke-width="1.5"/><circle cx="330" cy="60" r="5" fill="#56d4dd"><animate attributeName="opacity" values="1;0.4;1" dur="2s" begin="0.0s" repeatCount="indefinite"/></circle><circle cx="390" cy="48" r="5" fill="#56d4dd"><animate attributeName="opacity" values="1;0.4;1" dur="2s" begin="0.5s" repeatCount="indefinite"/></circle><circle cx="372" cy="112" r="5" fill="#56d4dd"><animate attributeName="opacity" values="1;0.4;1" dur="2s" begin="1.0s" repeatCount="indefinite"/></circle><circle cx="410" cy="96" r="5" fill="#56d4dd"><animate attributeName="opacity" values="1;0.4;1" dur="2s" begin="1.5s" repeatCount="indefinite"/></circle><circle r="3.5" fill="#f0f6fc"><animateMotion path="M330 60 L390 48 L410 96 L372 112 L330 60" dur="3.2s" repeatCount="indefinite"/></circle>
</svg>
